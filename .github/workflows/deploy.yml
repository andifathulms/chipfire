name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every action here runs on node24. The previous pins targeted node20,
      # which the runner no longer provides — it was force-running them on 24
      # and warning about it, so this makes explicit what was already happening.
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json. Pinning it here
      # too makes the action refuse to run rather than pick one.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The runtime the build itself uses, which is a separate thing from
          # the runtime the actions use. Node 20 is out of support.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # The engine and the AI both rest on determinism, so the full suite —
      # replay, cross-instance agreement, cascade termination, simulation —
      # gates every deploy rather than running on demand.
      - run: pnpm test:run

      # basePath must match the repository name or every asset 404s under the
      # Pages subpath.
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify the export
        run: |
          test -f out/index.html
          test -f out/.nojekyll
          test -f out/id/main/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
